name: Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"

# infra repo 동시 업데이트 방지 (Admin CI와 공유)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || 'reviewmaps-infra-update' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  DOCKER_IMAGE: ggorockee/reviewmaps-server
  INFRA_REPO: ggorockee/infra
  VALUES_FILE_PATH: charts/helm/prod/reviewmaps/values.yaml

jobs:
  # 린트 및 테스트
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "latest"
          working-directory: ./server

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o bin/api cmd/api/main.go

  # Docker 빌드 및 푸시 (main 브랜치 푸시 시에만)
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    # PR: Docker 빌드 검증만 (push 없음) / main push: 빌드 + push
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          TAG=$(date +%Y%m%d)-$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest

  # 매니페스트 업데이트 (ArgoCD GitOps)
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout App Repo for script
        uses: actions/checkout@v7

      - name: Checkout Infra Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ref: main
          path: "infra"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Update values.yaml
        run: |
          python .github/workflows/scripts/update_values.py \
            infra/${{ env.VALUES_FILE_PATH }} \
            server \
            "${{ needs.build-and-push.outputs.image_tag }}"

      - name: Create PR in Infra Repo
        working-directory: ./infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          # 커밋 메시지는 신뢰할 수 없는 입력 → 스크립트에 직접 삽입하지 않고 env로 전달
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Check for changes
          git add ${{ env.VALUES_FILE_PATH }}
          if git diff --staged --quiet; then
            echo "No changes to commit in values.yaml."
            exit 0
          fi

          # Create feature branch
          BRANCH_NAME="ci/update-reviewmaps-server-${{ needs.build-and-push.outputs.image_tag }}"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git commit -m "ci: Update reviewmaps-server image tag to ${{ needs.build-and-push.outputs.image_tag }}"

          # Push feature branch
          git push -u origin "$BRANCH_NAME"

          # Create PR and capture PR URL
          # Use heredoc to safely handle special characters in commit message
          PR_BODY=$(cat <<'EOF'
          Auto-generated PR to update reviewmaps-server Docker image tag

          **Image**: ggorockee/reviewmaps-server:${{ needs.build-and-push.outputs.image_tag }}
          **Triggered by**: __TRIGGERED_BY__

          🤖 Generated by GitHub Actions
          EOF
          )
          PR_BODY="${PR_BODY/__TRIGGERED_BY__/$HEAD_COMMIT_MESSAGE}"

          PR_URL=$(gh pr create \
            --title "ci: Update reviewmaps-server image to ${{ needs.build-and-push.outputs.image_tag }}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # Enable auto-merge (squash) and delete branch after merge
          gh pr merge --auto --squash --delete-branch "$PR_URL"
