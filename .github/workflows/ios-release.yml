name: iOS Release

# 수동 실행: Actions → iOS Release → Run workflow (업로드를 끄면 빌드·서명만 확인)
# 빌드 번호는 비워 두면 실행 시각(UTC, 예: 202611262110)으로 자동 지정. 버전 이름은 pubspec.yaml에서 읽음.
# GitHub의 Xcode 27 빌드 머신에서 빌드해 App Store Connect(TestFlight)에 업로드한다.
# 서명: 개발·배포 인증서(p12)를 임시 키체인에 넣고, 프로비저닝 프로필은 App Store Connect API 키로 자동 관리.
#
# 필요한 저장소 시크릿
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect API 키 ID, 발급자 ID
#   ASC_KEY_P8_BASE64           API 키 .p8 파일 base64
#   IOS_SIGNING_P12_BASE64, IOS_SIGNING_P12_PASSWORD  Apple Development·Distribution 인증서 p12
#   IOS_BUILD_FILES_BASE64      git에 없는 빌드 파일 묶음(tar.gz, mobile/ 기준 경로) base64

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "빌드 번호 (비워 두면 실행 시각으로 자동)"
        required: false
        default: ""
      upload:
        description: "App Store Connect에 업로드 (끄면 빌드·서명만 확인)"
        type: boolean
        default: true
      xcode:
        description: "Xcode 버전"
        required: true
        default: "27.2"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: 빌드 파일·API 키 준비
        env:
          IOS_BUILD_FILES_BASE64: ${{ secrets.IOS_BUILD_FILES_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          echo "$IOS_BUILD_FILES_BASE64" | base64 --decode | tar -xzf - -C .
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: 서명 인증서 임시 키체인
        env:
          P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - run: flutter pub get

      - name: 빌드 번호 정하기
        id: bn
        env:
          INPUT_BN: ${{ inputs.build_number }}
        run: |
          BN="${INPUT_BN:-$(date -u +%Y%m%d%H%M)}"
          case "$BN" in (*[!0-9]*|"") echo "빌드 번호는 숫자만 가능: $BN"; exit 1;; esac
          echo "number=$BN" >> "$GITHUB_OUTPUT"
          echo "### 빌드 번호 $BN (버전 $(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Swift 패키지 받기
        run: |
          flutter build ios --release --config-only --no-codesign --build-number "${{ steps.bn.outputs.number }}"
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner

      - name: 아카이브 (서명)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" -c "Print :ApplicationProperties:CFBundleVersion" build/ios/archive/Runner.xcarchive/Info.plist

      - name: 서명·App Store Connect 업로드
        env:
          DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>KSSVSPN647</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          if [ "$DESTINATION" = export ]; then ls -la "$RUNNER_TEMP/export"; echo "### 업로드 안 함 (빌드·서명 확인만)" >> "$GITHUB_STEP_SUMMARY"; else echo "### App Store Connect 업로드 완료" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 정리
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
