name: Admin CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/ci-admin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/ci-admin.yml"

# infra repo 동시 업데이트 방지 (Server CI와 공유)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || 'reviewmaps-infra-update' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE: ggorockee/reviewmaps-admin
  INFRA_REPO: ggorockee/infra
  VALUES_FILE_PATH: charts/helm/prod/reviewmaps/values.yaml

jobs:
  # 린트 및 테스트
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Check Django configuration
        run: uv run python manage.py check
        env:
          DJANGO_SECRET_KEY: test-secret-key
          POSTGRES_SERVER: localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test

  # Docker 빌드 및 푸시 (main 브랜치 푸시 시에만)
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    # PR: Docker 빌드 검증만 (push 없음) / main push: 빌드 + push
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          TAG=$(date +%Y%m%d)-$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest

  # 매니페스트 업데이트 (ArgoCD GitOps)
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout App Repo for script
        uses: actions/checkout@v7

      - name: Checkout Infra Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ref: main
          path: "infra"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Update values.yaml
        run: |
          python .github/workflows/scripts/update_values.py \
            infra/${{ env.VALUES_FILE_PATH }} \
            admin \
            "${{ needs.build-and-push.outputs.image_tag }}"

      - name: Create PR in Infra Repo
        working-directory: ./infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          # 커밋 메시지는 신뢰할 수 없는 입력 → 스크립트에 직접 삽입하지 않고 env로 전달
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Check for changes
          git add ${{ env.VALUES_FILE_PATH }}
          if git diff --staged --quiet; then
            echo "No changes to commit in values.yaml."
            exit 0
          fi

          # Create feature branch
          BRANCH_NAME="ci/update-reviewmaps-admin-${{ needs.build-and-push.outputs.image_tag }}"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git commit -m "ci: Update reviewmaps-admin image tag to ${{ needs.build-and-push.outputs.image_tag }}"

          # Push feature branch
          git push -u origin "$BRANCH_NAME"

          # Create PR and capture PR URL
          PR_URL=$(gh pr create \
            --title "ci: Update reviewmaps-admin image to ${{ needs.build-and-push.outputs.image_tag }}" \
            --body "Auto-generated PR to update reviewmaps-admin Docker image tag

          **Image**: ggorockee/reviewmaps-admin:${{ needs.build-and-push.outputs.image_tag }}
          **Triggered by**: ${HEAD_COMMIT_MESSAGE}

          🤖 Generated by GitHub Actions" \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # Enable auto-merge (squash) using PR URL
          gh pr merge --auto --squash "$PR_URL"
