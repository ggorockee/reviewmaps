# location 안에서 add_header를 쓰면 server 단 add_header가 상속되지 않으므로 보안 헤더를 각 location에 둔다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Istio 게이트웨이 뒤에서는 컨테이너 포트(8080)·http가 리다이렉트 URL에 섞이므로 상대 경로로 리다이렉트
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html (배포 직후 새 화면을 받도록 캐시 안 함)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # /login 처럼 디렉터리로 생성된 경로는 리다이렉트 없이 index.html을 바로 제공
        try_files $uri $uri/index.html /index.html;
    }
}
