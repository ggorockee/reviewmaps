name: Admin CI/CD

# 리뷰맵 관리자 화면 (Nuxt 정적 SPA → nginx). Django 관리자(admin-django/)는 전환 후 30일까지 보관만 하고 빌드하지 않음.
on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/ci-admin.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/ci-admin.yml"

# 배포는 워크플로별 그룹으로 순차 실행 (공유 그룹은 대기 중 실행이 취소되는 문제가 있어 분리)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || format('deploy-{0}', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  DOCKER_IMAGE: ggorockee/reviewmaps-admin
  INFRA_REPO: ggorockee/infra
  VALUES_FILE_PATH: charts/helm/prod/reviewmaps/values.yaml

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate

  # Docker 빌드 (PR: 빌드만 / main push: 빌드 + push). API 주소는 Dockerfile ARG API_BASE 기본값(https://api.review-maps.com)
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # latest 태그는 쓰지 않음: 같은 저장소의 Django 이미지(되돌리기용 20261110-7ed5b97)와 헷갈리지 않게 날짜-커밋 태그만
      - uses: docker/build-push-action@v7
        with:
          context: ./admin
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}

  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    # 전환(계획 Phase 5) 전까지 꺼 둠: 지금 운영 admin은 Django(포트 8000)라 새 이미지가 들어가면 관리자 화면이 멈춤.
    # 전환 때 저장소 변수 ADMIN_AUTO_DEPLOY=true 로 켠다 (Settings → Secrets and variables → Actions → Variables).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ADMIN_AUTO_DEPLOY == 'true'

    steps:
      - name: Checkout App Repo for script
        uses: actions/checkout@v7

      - name: Checkout Infra Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ref: main
          path: "infra"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Update values.yaml
        run: |
          python .github/workflows/scripts/update_values.py \
            infra/${{ env.VALUES_FILE_PATH }} \
            admin \
            "${{ needs.build-and-push.outputs.image_tag }}"

      - name: Create PR in Infra Repo
        working-directory: ./infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          # 커밋 메시지는 신뢰할 수 없는 입력 → 스크립트에 직접 삽입하지 않고 env로 전달
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 변경 여부 확인
          git add ${{ env.VALUES_FILE_PATH }}
          if git diff --staged --quiet; then
            echo "No changes to commit in values.yaml."
            exit 0
          fi

          # 브랜치 생성
          BRANCH_NAME="ci/update-reviewmaps-admin-${{ needs.build-and-push.outputs.image_tag }}"
          git checkout -b "$BRANCH_NAME"

          # 커밋
          git commit -m "ci: Update reviewmaps-admin image tag to ${{ needs.build-and-push.outputs.image_tag }}"

          # 브랜치 푸시
          git push -u origin "$BRANCH_NAME"

          # Create PR and capture PR URL
          PR_URL=$(gh pr create \
            --title "ci: Update reviewmaps-admin image to ${{ needs.build-and-push.outputs.image_tag }}" \
            --body "Auto-generated PR to update reviewmaps-admin Docker image tag

          **Image**: ggorockee/reviewmaps-admin:${{ needs.build-and-push.outputs.image_tag }}
          **Triggered by**: ${HEAD_COMMIT_MESSAGE}

          🤖 Generated by GitHub Actions" \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # PR 자동 머지(squash) 예약
          # PR이 이미 머지 가능한 상태(clean)면 auto-merge 예약이 거부됨 → 즉시 squash 머지로 대체
          gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
